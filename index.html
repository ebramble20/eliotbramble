<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eliot Bramble — Drawings</title>
<meta name="description" content="Cross-section drawings by Eliot Bramble.">

<!--
  HOW TO ADD YOUR DRAWINGS
  ========================
  1. Put your image files in an /images folder next to this file,
     e.g. images/plate-01.webp (thumbnail ~800px wide)
          images/plate-01-full.webp (full view ~2000px wide)
  2. Find the <figure class="plate"> blocks below. For each one:
       - set src to the thumbnail
       - set data-full to the full-size image
       - set alt to a short description of the drawing
       - edit the caption title
  3. Duplicate a <figure> block for each new drawing.
  Delete or add blocks freely — the layout adapts.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #FCFCFA;
    --ink: #1C1C1A;
    --graphite: #8B8B85;
    --hairline: #E4E4DF;
    --seal: #C43E2F; /* used once: the artist's mark */
    --serif: "Instrument Serif", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 28px 40px;
  }
  .wordmark {
    font-family: var(--serif);
    font-size: 22px;
    text-decoration: none;
    letter-spacing: 0.01em;
  }
  .wordmark .mark { color: var(--seal); }
  nav a {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    margin-left: 28px;
    color: var(--graphite);
    transition: color 160ms ease;
  }
  nav a:hover { color: var(--ink); }

  /* ---------- intro ---------- */
  .intro {
    max-width: 640px;
    margin: 10vh auto 12vh;
    padding: 0 40px;
    text-align: center;
  }
  .intro h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(30px, 5vw, 44px);
    line-height: 1.2;
  }
  .intro p {
    margin-top: 16px;
    color: var(--graphite);
    font-size: 13px;
  }

  /* ---------- plates ---------- */
  .plates {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 40px 8vh;
  }

  .plate {
    margin: 0 0 12vh;
    max-width: 640px;
  }
  /* book-like rhythm: alternate plates drift left / right on wide screens */
  @media (min-width: 900px) {
    .plate:nth-child(odd)  { margin-right: auto; }
    .plate:nth-child(even) { margin-left: auto; }
  }

  .plate button {
    display: block;
    width: 100%;
    border: none;
    background: none;
    padding: 0;
    cursor: zoom-in;
  }
  .plate img, .plate svg {
    display: block;
    width: 100%;
    height: auto;
    transition: transform 220ms ease;
  }
  .plate button:hover img,
  .plate button:hover svg { transform: translateY(-3px); }

  /* caption drawn like a diagram annotation: leader line + label */
  figcaption {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-top: 14px;
  }
  figcaption::before {
    content: "";
    width: 32px;
    height: 1px;
    background: var(--ink);
    align-self: center;
    flex-shrink: 0;
  }
  figcaption .num {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--graphite);
  }
  figcaption .title {
    font-family: var(--serif);
    font-size: 17px;
  }

  /* ---------- assembly ---------- */
  .assembly {
    margin: 0 auto 12vh;
    padding: 0 24px;
  }
    .stage {
    position: relative;
    width: min(100%, 2366px);
    aspect-ratio: 1183 / 446;
    margin: 0 auto;
    transform-origin: center center;
    transition: transform 900ms cubic-bezier(.65,.02,.28,1);
  }
  .stage[data-state="apart"] { transform: scale(0.82); }
  }
  @media (min-width: 2440px) {
    .stage { width: 2366px; }
  }
  /* below native width the image must scale down — smooth beats dropped lines */
  @media (max-width: 1230px) {
    .stage img { image-rendering: auto; }
  }
  .stage img {
    position: absolute;
    width: auto;
    /* drawn on a fixed pixel increment — scale without interpolation */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transition: transform 900ms cubic-bezier(.65,.02,.28,1);
  }
  /* true registered positions, as percentages of the assembled block */
  .stage .b-left  { left: 0;      top: 0; width: 52.494%; height: 100%; }
  .stage .b-mid   { left: 42.181%; top: 0; width: 14.455%; height: 100%; }
  .stage .b-right { left: 56.467%; top: 0; width: 43.533%; height: 100%; }

  .stage[data-state="apart"] .b-left  { transform: translateX(-11%); }
  .stage[data-state="apart"] .b-right { transform: translateX(11%); }

  .assembly-bar {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin: 22px auto 0;
    width: min(100%, 2366px);
  }
  .assembly-bar button {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--ink);
    padding: 9px 16px;
    cursor: pointer;
    color: var(--ink);
    transition: background 160ms ease, color 160ms ease;
  }
  .assembly-bar button:hover { background: var(--ink); color: var(--paper); }
  .assembly-bar .note { font-size: 12px; color: var(--graphite); }

  @media (prefers-reduced-motion: reduce) {
    .stage[data-state="apart"] .b-left,
    .stage[data-state="apart"] .b-right { transform: none; }
  }

  /* ---------- about ---------- */
  .about {
    border-top: 1px solid var(--hairline);
    max-width: 640px;
    margin: 0 auto;
    padding: 10vh 40px 12vh;
  }
  .about h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 26px;
    margin-bottom: 18px;
  }
  .about p { color: var(--ink); margin-bottom: 14px; max-width: 52ch; }
  .about .contact {
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  footer {
    text-align: center;
    padding: 0 40px 40px;
    color: var(--graphite);
    font-size: 11px;
    letter-spacing: 0.08em;
  }

  /* ---------- lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: var(--paper);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 24px 40px;
    z-index: 10;
  }
  .lightbox.open { display: flex; }
  .lightbox img, .lightbox svg {
    max-width: min(92vw, 1100px);
    max-height: 78vh;
    width: auto;
    height: auto;
  }
  .lightbox figcaption { justify-content: center; }
  .lightbox .close {
    position: absolute;
    top: 20px;
    right: 28px;
    background: none;
    border: none;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--graphite);
    cursor: pointer;
  }
  .lightbox .close:hover { color: var(--ink); }
  .lightbox .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-family: var(--serif);
    font-size: 34px;
    color: var(--graphite);
    cursor: pointer;
    padding: 12px;
  }
  .lightbox .arrow:hover { color: var(--ink); }
  .lightbox .prev { left: 16px; }
  .lightbox .next { right: 16px; }

  @media (max-width: 600px) {
    header, .intro, .plates, .about { padding-left: 22px; padding-right: 22px; }
    .lightbox .arrow { font-size: 26px; }
  }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="#">Eliot Bramble<span class="mark">.</span></a>
  <nav>
    <a href="#assembly">Work</a>
    <a href="#about">About</a>
  </nav>
</header>

<section class="intro">
  <h1>Cross-section drawings of small, complicated worlds.</h1>
  <p>Selected work — New York</p>
</section>



<section class="assembly" id="assembly">
  <div class="stage" data-state="apart">
    <img class="b-left" src="left.webp" alt="Cross-section of the left building: kitchens, workshops, stacked living floors and a basement garage.">
    <img class="b-mid" src="mid.webp" alt="Cross-section of the narrow middle tower: a full-height shaft with machinery at its base.">
    <img class="b-right" src="right.webp" alt="Cross-section of the right building: warren of small rooms, stairs and storage over a lower hall.">
  </div>
  <div class="assembly-bar">
    <button type="button" id="assembleBtn" aria-pressed="false">Join the buildings</button>
    <span class="note">Three sections — drawn to meet.</span>
  </div>
</section>

<section class="about" id="about">
  <h2>About</h2>
  <p>Drawings of buildings in cross-section, made on a fixed grid so that any two can meet.</p>
  <p class="contact"><a href="mailto:eliot@blackbird.cc">eliot@blackbird.cc</a></p>
</section>

<footer>© 2026 Eliot Bramble — all drawings original</footer>

<div class="lightbox" role="dialog" aria-modal="true" aria-label="Drawing viewer">
  <button class="close" type="button">Close&nbsp;&nbsp;Esc</button>
  <button class="arrow prev" type="button" aria-label="Previous drawing">&larr;</button>
  <figure>
    <div class="lb-media"></div>
    <figcaption>
      <span class="num"></span>
      <span class="title"></span>
    </figcaption>
  </figure>
  <button class="arrow next" type="button" aria-label="Next drawing">&rarr;</button>
</div>

<script>
  const plates = Array.from(document.querySelectorAll('.plate'));
  const lightbox = document.querySelector('.lightbox');
  const media = lightbox.querySelector('.lb-media');
  const lbNum = lightbox.querySelector('.num');
  const lbTitle = lightbox.querySelector('.title');
  let current = -1;
  let lastFocused = null;

  function show(i) {
    current = (i + plates.length) % plates.length;
    const plate = plates[current];
    const img = plate.querySelector('img');
    media.innerHTML = '';
    if (img) {
      const full = document.createElement('img');
      full.src = img.dataset.full || img.src;
      full.alt = img.alt;
      media.appendChild(full);
    } else {
      media.appendChild(plate.querySelector('svg').cloneNode(true));
    }
    lbNum.textContent = plate.querySelector('.num').textContent;
    lbTitle.textContent = plate.querySelector('.title').textContent;
  }

  function open(i) {
    lastFocused = document.activeElement;
    show(i);
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    lightbox.querySelector('.close').focus();
  }

  function close() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    if (lastFocused) lastFocused.focus();
  }

  plates.forEach((plate, i) => {
    plate.querySelector('button').addEventListener('click', () => open(i));
  });
  lightbox.querySelector('.close').addEventListener('click', close);
  lightbox.querySelector('.prev').addEventListener('click', () => show(current - 1));
  lightbox.querySelector('.next').addEventListener('click', () => show(current + 1));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) close(); });

  const stage = document.querySelector('.stage');
  const assembleBtn = document.getElementById('assembleBtn');
  assembleBtn.addEventListener('click', () => {
    const joined = stage.dataset.state === 'together';
    stage.dataset.state = joined ? 'apart' : 'together';
    assembleBtn.textContent = joined ? 'Join the buildings' : 'Separate';
    assembleBtn.setAttribute('aria-pressed', String(!joined));
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });
</script>

</body>
</html>
